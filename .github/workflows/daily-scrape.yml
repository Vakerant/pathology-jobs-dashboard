name: Daily pathology scrape

on:
  push:
    # Only the default branch publishes. `branches: ["**"]` used to run the
    # full network scrape and push bot commits onto every contributor branch.
    branches: ["main"]
  # Pull requests run the `test` gate only. They deliberately do NOT publish:
  # actions/checkout leaves a PR checkout in DETACHED HEAD, where the
  # `git push` below fails with "fatal: You are not currently on a branch",
  # so every PR used to show a red scrape job.
  pull_request:
  schedule:
    # FALLBACK ONLY. The laptop's 08:00 IST timer (run_daily.sh) is the
    # scraper of record and pushes public/ itself: many Indian government
    # sites time out for GitHub's US runners. This 12:30 IST check scrapes
    # only when the laptop's last publish is more than 36h old.
    - cron: "0 7 * * *"
  # Manual "Run workflow" always scrapes (an explicit request).
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two scrapes race for the same cached DB / git push.
concurrency:
  group: pathology-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────────
  # The unit suite (300+ tests, ~20s, hermetic: tmp_path DBs, no network, no
  # browser) is the contract for the pipeline below. It used to never run in CI
  # at all, so a regression could ship straight into the published mirror.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint (ruff)
        run: |
          pip install ruff==0.17.4
          ruff check .

      - name: Byte-compile every module
        run: python -m compileall -q app.py scraper.py db.py repository.py migrations.py config.py alerts.py sources.py export_static.py seed.py purge_removed_sources.py

      - name: Run unit tests
        run: python -m pytest tests/ -q

  # ── Is the laptop's published data stale? ─────────────────────────────────
  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          if os.environ["EVENT"] == "workflow_dispatch":
              print("stale=true"); raise SystemExit
          try:
              last = json.load(open("public/data.json"))["stats"]["last_run"]
              age_h = (datetime.now(timezone.utc) - datetime.fromisoformat(last)).total_seconds() / 3600
          except Exception:
              age_h = 1e9
          print(f"stale={'true' if age_h > 36 else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  # ── UI-only publish on code pushes ────────────────────────────────────────
  # Data comes from the laptop, but a dashboard change pushed to main should go
  # live now, not at the laptop's next run. public/index.html is a plain copy
  # of templates/dashboard.html, so refresh just that file.
  publish-ui:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Copy the dashboard template into the mirror
        run: |
          cp templates/dashboard.html public/index.html
          if git diff --quiet -- public/index.html; then
            echo "public/index.html already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "chore: refresh dashboard page [skip ci]"
          git push

  # ── Publish (fallback scrape) ─────────────────────────────────────────────
  scrape:
    needs: [test, freshness]
    # Only when the laptop has not published for 36h (or on a manual run).
    # Never on push / pull_request: two scrapers publishing would flip the
    # live site between two different datasets.
    if: needs.freshness.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Restore cached DB (if any)
        uses: actions/cache@v4
        with:
          path: data.db
          # cache keys are immutable, so a unique key is what makes each run's DB get saved.
          key: pathology-db-${{ github.run_id }}
          restore-keys: |
            pathology-db-

      - name: Seed + scrape + build static
        run: |
          python seed.py
          python scraper.py
          python export_static.py
          ls -lh public/data.json || echo "no data.json"
          python_count=$(python -c "import json; print(len(json.load(open('public/data.json'))['listings']))")
          echo "listings=$python_count" >> $GITHUB_ENV

      - name: Verify data integrity before publishing
        # The opportunity-first projection is only useful if it stays in sync
        # with `listings`. Fail the run rather than publish a drifting mirror.
        run: |
          python - <<'PY'
          import json, sys
          import db, repository
          db.init_db()
          p = repository.verify_projection()
          print(json.dumps(p, indent=2))
          db.set_meta("last_run_projection", json.dumps(p))
          if not p["ok"]:
              print("::error::projection invariant violated — refusing to publish")
              sys.exit(1)
          PY

      - name: Commit updated static mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # public/data.json is gitignored locally but we force-add the fresh build
          git add -f public/data.json public/index.html 2>/dev/null || git add -f public/data.json
          # keep DB in cache, not in git; but save a tiny meta for next run
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: CI fallback scrape ${{ env.listings }} listings [skip ci]"
          git push

      - name: Summary
        run: |
          echo "✅ Scraped ${{ env.listings }} listings — public/data.json updated"
          echo "Vercel will auto-deploy if connected to this repo."
